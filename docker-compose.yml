# Retained for compatibility with existing Compose v1 installations.
version: "3.7"

services:
  worker:
    image: worker:1.14.2-v8
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: worker
    # TUN／路由需要 NET_ADMIN；legacy iptables 控制 socket 及介面綁定需要 NET_RAW。
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run:rw,nosuid,nodev,noexec,mode=0700
      - /tmp:rw,nosuid,nodev,noexec,mode=0700
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      # The trusted host manager enables forwarding after local policy checks.
      # Container /proc/sys stays read-only; no privileged mode is needed.
      net.ipv4.ip_forward: "0"
      net.ipv4.conf.all.route_localnet: "1"
      net.ipv4.conf.default.route_localnet: "1"
      net.ipv4.conf.all.rp_filter: "0"
      net.ipv4.conf.default.rp_filter: "0"
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"
      net.ipv6.conf.lo.disable_ipv6: "1"
    volumes:
      - ./network.json:/etc/worker/network.json:ro
    # Disable inherited checks when reusing an existing compatible image too.
    healthcheck:
      disable: true
    restart: unless-stopped
